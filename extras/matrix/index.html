<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Rain Screensaver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    body {
        background: #000;
        overflow: hidden;
        font-family: 'Courier New', monospace;
    }

    canvas {
        display: block;
    }

    #brightness-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="brightness-overlay"></div>
    <script src="matrix.js"></script>
</body>
</html>
