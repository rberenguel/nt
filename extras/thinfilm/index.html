<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thin Film Hydrodynamics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #040608;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      color: rgba(220, 235, 245, 0.85);
      background: rgba(4, 8, 14, 0.72);
      border: 1px solid rgba(80, 140, 180, 0.25);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      pointer-events: none;
      user-select: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: opacity 0.3s ease;
    }
    #hud.hidden {
      opacity: 0;
    }
    .hud-key {
      color: #e2a854;
      font-weight: 600;
    }
    .hud-val {
      color: #63d2c6;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>Soap Bubble Thin-Film Surface</strong> (Dual-Screen 32:9)</div>
    <div>Screen: <span id="hudScreen" class="hud-val">0 / 2</span> | Master: <span id="hudMaster" class="hud-val">YES</span></div>
    <div><span class="hud-key">[Space/Click]</span> Stir Vortices | <span class="hud-key">[D]</span> Speed: <span id="hudSpeed" class="hud-val">1.0x</span></div>
    <div><span class="hud-key">[M]</span> Palette: <span id="hudStyle" class="hud-val">Natural Newton</span> | <span class="hud-key">[B]</span> Bezel: <span id="hudBezel" class="hud-val">OFF</span></div>
    <div><span class="hud-key">[R]</span> Clear Swirls | <span class="hud-key">[S]</span> Save PNG | <span class="hud-key">[H]</span> Toggle HUD | <span class="hud-key">[Q]</span> Quit</div>
  </div>

  <canvas id="glcanvas"></canvas>
  <script src="thinfilm.js"></script>
</body>
</html>
