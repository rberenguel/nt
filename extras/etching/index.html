<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Etching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,700&family=EB+Garamond:ital,wght@1,500&family=IM+Fell+English:ital@1&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4eedb;
    }
    #etchingCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="etchingCanvas"></canvas>
  <script src="noise.js"></script>
  <script src="palettes.js"></script>
  <script src="sun.js"></script>
  <script src="sky.js"></script>
  <script src="clouds.js"></script>
  <script src="mountains.js"></script>
  <script src="naming.js"></script>
  <script src="etching.js"></script>
</body>
</html>
