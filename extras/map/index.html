<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=EB+Garamond:ital,wght@1,500;1,600&family=IM+Fell+English:ital@1&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1614;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .hud {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(60, 45, 30, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="mapCanvas"></canvas>
  <div class="hud">Click or Space to generate new map</div>

  <script src="noise.js"></script>
  <script src="palettes.js"></script>
  <script src="mountain.js"></script>
  <script src="river.js"></script>
  <script src="forest.js"></script>
  <script src="coast.js"></script>
  <script src="cartouche.js"></script>
  <script src="map.js"></script>
</body>
</html>
